name: Update Pokemon News

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create News
        run: |

          cat > news.json << 'EOF'
          [
            {
              "title":"🚨 Pokémon GO自動更新測試",
              "date":"2026-10-19",
              "rating":"★★★★★",
              "summary":"GitHub Actions運作成功"
            }
          ]
          EOF

      - name: Commit Changes

        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add news.json

          git commit -m "Auto update news" || echo "No changes"

          git push

<!DOCTYPE html>
<html lang="zh-HK">
<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>GO速報 AI</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

.header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
}

.card{
background:white;
margin:15px;
padding:15px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.button{
background:#2563eb;
color:white;
padding:10px;
display:block;
text-align:center;
border-radius:8px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">

<h1>🚨 GO速報 AI</h1>

<p>Pokémon GO 即時情報站</p>

</div>

<div class="card">

<h2>歡迎使用</h2>

<p>

這裡將會顯示：

✅ 官方活動

✅ 團體戰頭目

✅ 社群日

✅ GO Fest

✅ AI重點摘要

</p>

</div>

<div class="card">

<h2>最新消息</h2>

<div id="news">
載入中...
</div>

</div>
<script>

async function loadNews() {

const response = await fetch('./news.json');

const data = await response.json();

let html = '';

data.forEach(item => {

html += `
<div style="
margin-top:15px;
padding:10px;
border-bottom:1px solid #ddd;
">

<h3>${item.title}</h3>

<p>${item.date}</p>

<p>${item.summary}</p>

<p>AI評分：${item.rating}</p>

</div>
`;

});

document.getElementById('news').innerHTML = html;

}

loadNews();

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="zh-HK">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GO速報 AI</title>

<meta name="theme-color"
content="#2563eb">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
-apple-system,
BlinkMacSystemFont,
Arial,
sans-serif;

background:#f3f4f6;

color:#222;

}

.header{

background:
linear-gradient(
135deg,
#2563eb,
#7c3aed
);

color:white;

padding:30px;

text-align:center;

}

.header h1{

font-size:32px;

margin-bottom:10px;

}

.header p{

opacity:.9;

}

.container{

max-width:900px;

margin:auto;

padding:15px;

}

.card{

background:white;

padding:18px;

border-radius:16px;

margin-bottom:15px;

box-shadow:
0 2px 8px rgba(0,0,0,.1);

}

.news-item{

padding:15px;

margin-top:15px;

background:#fafafa;

border-left:5px solid #2563eb;

border-radius:12px;

}

.news-item h3{

margin-bottom:8px;

}

.rating{

color:#f59e0b;

font-weight:bold;

font-size:18px;

}

.date{

font-size:14px;

color:#666;

margin-bottom:8px;

}

.badge{

display:inline-block;

background:#dbeafe;

color:#1d4ed8;

padding:4px 10px;

border-radius:999px;

font-size:12px;

margin-bottom:10px;

}

.button{

display:block;

background:#2563eb;

color:white;

padding:12px;

text-align:center;

border-radius:10px;

text-decoration:none;

font-weight:bold;

margin-top:10px;

}

.footer{

text-align:center;

padding:30px;

font-size:12px;

color:#666;

}

.loading{

color:#888;

text-align:center;

padding:20px;

}
.news-item{

padding:15px;

margin-top:15px;

background:#fafafa;

border-left:5px solid #2563eb;

border-radius:12px;

}

.date{

font-size:14px;

color:#666;

margin-top:8px;

}

.rating{

color:#f59e0b;

font-weight:bold;

margin-top:10px;

}

</style>

</head>

<body>

<div class="header">

<h1>🚨 GO速報 AI</h1>

<p>
Pokémon GO 官方即時情報站
</p>

</div>

<div class="container">

<div class="card">

<div class="badge">
即時資訊
</div>

<h2>歡迎使用</h2>

<br>

<p>

✅ 官方活動<br><br>

✅ 團體戰頭目<br><br>

✅ 社群日消息<br><br>

✅ GO Fest消息<br><br>

✅ AI重點摘要

</p>

</div>

<div class="card">

<div class="badge">
最新消息
</div>

<h2>
🔥 Pokémon GO 官方快訊
</h2>

<div id="news">

<div class="loading">
載入最新消息中...
</div>

</div>

</div>

<div class="card">

<div class="badge">
即將推出
</div>

<h2>🤖 AI功能</h2>

<br>

<p>

✅ AI活動評分<br><br>

✅ 必抓寶可夢推薦<br><br>

✅ 必打團體戰分析<br><br>

✅ 活動重點摘要<br><br>

✅ Discord 推播通知

</p>

</div>

<a
class="button"
href="https://pokemongolive.com"
target="_blank">

查看官方網站

</a>

</div>

<div class="footer">

GO速報 AI<br>

Powered by GitHub Pages

</div>

<script>

async function loadNews(){

try{

const response =
await fetch('./news.json?v=' + Date.now());

const data =
await response.json();

let html = '';

data.forEach(item => {

html += `

<div class="news-item">

<h3>${item.title}</h3>

<p class="date">
📅 ${item.date}
</p>

<p>
${item.summary}
</p>

<p class="rating">
⭐ ${item.rating}
</p>

${item.ai ? `
<p>
🤖 ${item.ai}
</p>
` : ''}

</div>

`;

});

document.getElementById('news')
.innerHTML = html;

}

catch(error){

document.getElementById('news')
.innerHTML =
'❌ 無法載入最新消息';

}

}

loadNews();

</script>


</body>

</html>
